# Lets the three Telegram functions be deployed with one command, carrying the
# right JWT setting each — the webhook's is the one that is easy to get wrong by
# hand, and getting it wrong makes the bot look dead rather than broken.
#
#   npx supabase login
#   npx supabase functions deploy --project-ref euvmtcfioafwafudpcda
#
# The project ref is not a secret: it is the hostname every client already
# talks to. Tokens live in the dashboard's function secrets, never here.
project_id = "euvmtcfioafwafudpcda"

# Called by the owner app with a signed-in session, so the gateway checks it.
[functions.send-telegram]
verify_jwt = true

[functions.announce-telegram]
verify_jwt = true

# Called by Telegram, which has no Supabase session. With verification on, every
# update is rejected before it reaches the function. Its own shared secret in
# the X-Telegram-Bot-Api-Secret-Token header is what authenticates the caller.
[functions.telegram-webhook]
verify_jwt = false
